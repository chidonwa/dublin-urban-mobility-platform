version: 2

models:
  - name: stg_gtfs_routes
    description: Cleaned staging model for NTA GTFS routes.

    columns:
      - name: route_id
        description: Unique identifier for a GTFS route.
        data_tests:
          - not_null
          - unique

      - name: route_type
        description: GTFS code identifying the type of transport.
        data_tests:
          - not_null

  - name: stg_gtfs_trips
    description: Cleaned staging model for NTA GTFS trips.

    columns:
      - name: trip_id
        description: Unique identifier for a GTFS trip.
        data_tests:
          - not_null
          - unique

      - name: route_id
        description: Route associated with the trip.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_gtfs_routes')
                field: route_id

      - name: service_id
        description: Service identifier associated with the trip.
        data_tests:
          - not_null

  - name: stg_gtfs_stops
    description: Cleaned staging model for NTA GTFS stops.

    columns:
      - name: stop_id
        description: Unique identifier for a GTFS stop.
        data_tests:
          - not_null
          - unique

      - name: stop_name
        description: Name of the GTFS stop.
        data_tests:
          - not_null

      - name: stop_lat
        description: Latitude of the stop.
        data_tests:
          - not_null

      - name: stop_lon
        description: Longitude of the stop.
        data_tests:
          - not_null

  - name: stg_gtfs_stop_times
    description: Cleaned staging model for NTA GTFS scheduled stop times.

    columns:
      - name: trip_id
        description: Trip associated with the stop-time record.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_gtfs_trips')
                field: trip_id

      - name: stop_id
        description: Stop associated with the stop-time record.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_gtfs_stops')
                field: stop_id

      - name: stop_sequence
        description: Position of the stop within the trip.
        data_tests:
          - not_null
